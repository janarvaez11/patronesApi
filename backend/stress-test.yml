config:
  target: "http://localhost:3000"

  plugins:
    ensure: {}

  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. Fase de Calentamiento - Trafico Base"

    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. Fase de Saturacion Maxima - Pico de Carga"

  ensure:
    thresholds:
      - "http.response_time.p99": 200
    maxErrorRate: 1

scenarios:
  - name: "Payloads mixtos con validacion Zod"

    flow:

      # Flujo A: petición correcta
      - post:
          url: "/api/v1/empleados"
          json:
            nombre: "Andres Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200

      - think: 1

      # Flujo B: petición corrupta
      - post:
          url: "/api/v1/empleados"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500