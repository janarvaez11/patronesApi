name: Build and deploy frontend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare production package
        run: |
          rm -rf frontend/deploy
          mkdir -p frontend/deploy

          cp frontend/package.json frontend/deploy/
          cp frontend/package-lock.json frontend/deploy/
          cp frontend/server.mjs frontend/deploy/

          cp -r frontend/dist frontend/deploy/

          cd frontend/deploy
          npm ci --omit=dev

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F18F0FDEADBC4D48894B54C98DFDD265 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0F9B52195EA54082A2E72845236D841E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FD19B3D77184B69B8459B0F28C30683 }}

      - name: Deploy frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'patronesapi-frontend-janarvaez11'
          slot-name: 'Production'
          package: './frontend/deploy'